<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1600" height="600" viewBox="0 0 1600 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2BE63"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="600" fill="#061B3A"/>

  <!-- Outer O -->
  <ellipse cx="300" cy="300" rx="120" ry="170"
           fill="none" stroke="url(#gold)" stroke-width="22"/>

  <!-- Simplified medical symbol -->
  <line x1="300" y1="180" x2="300" y2="430"
