  <!-- Wings -->
  <path d="M250 205 Q210 210 185 185 Q210 230 270 220"
        fill="none" stroke="url(#gold)" stroke-width="10" stroke-linecap="round"/>
  <path d="M350 205 Q390 210 415 185 Q390 230 330 220"
        fill="none" stroke="url(#gold)" stroke-width="10" stroke-linecap="round"/>

  <!-- Serpent -->
  <path d="M300 240
           C260 260, 340 280, 300 300
           C260 320, 340 340, 300 360
           C270 375, 310 395, 300 420"
        fill="none" stroke="url(#gold)" stroke-width="10" stroke-linecap="round"/>

  <!-- Brand name -->
  <text x="520" y="330"
        font-family="Helvetica, Arial, sans-serif"
        font-size="150"
        letter-spacing="10"
        fill="url(#gold)">
        OLLIV
  </text>

  <text x="525" y="420"
        font-family="Helvetica, Arial, sans-serif"
