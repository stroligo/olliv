<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="700" viewBox="0 0 1800 700">

<defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#E4C05C"/>
        <stop offset="100%" stop-color="#BE8F2F"/>
    </linearGradient>
</defs>

<rect width="100%" height="100%" fill="#041B44"/>

<!-- ICON -->
<g transform="translate(120,90)">

    <!-- Outer ring -->
    <ellipse cx="180" cy="250" rx="120" ry="180"
        fill="none"
        stroke="url(#gold)"
        stroke-width="20"/>

    <!-- Staff -->
    <line x1="180" y1="140" x2="180" y2="470"
        stroke="url(#gold)"
        stroke-width="12"
        stroke-linecap="round"/>

    <!-- Wings -->
    <path d="
        M70 180
        C95 205, 130 210, 170 200
        C135 225, 95 228, 55 205
    "
    fill="none"
    stroke="url(#gold)"
    stroke-width="10"
    stroke-linecap="round"/>

    <path d="
        M290 180
        C265 205, 230 210, 190 200
        C225 225, 265 228, 305 205
    "
    fill="none"
    stroke="url(#gold)"
    stroke-width="10"
    stroke-linecap="round"/>

    <!-- Serpent -->
    <path d="
        M180 210
        C140 240, 220 270, 180 300
        C140 330, 220 360, 180 390
        C155 415, 190 440, 180 460
    "
    fill="none"
    stroke="url(#gold)"
    stroke-width="11"
    stroke-linecap="round"/>

</g>

<!-- TEXT -->
<g transform="translate(560,210)">
    <text x="0" y="170"
        font-family="Montserrat, Helvetica, Arial, sans-serif"
        font-size="170"
        font-weight="500"
        letter-spacing="8"
        fill="url(#gold)">
        OLLIV
    </text>

    <text x="5" y="290"
        font-family="Montserrat, Helvetica, Arial, sans-serif"
        font-size="72"
        font-weight="300"
        letter-spacing="7"
        fill="#F2F2F2">
        PERÍCIA MÉDICA
    </text>
</g>

</svg>
